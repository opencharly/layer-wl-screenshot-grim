wl-screenshot-grim:
    candy:
        description: |
            Wayland screenshot capture via grim on wlroots compositors
            Installs grim, the de-facto screenshot tool for wlroots Wayland
            sessions. Verifiable: the grim binary lands at /usr/bin/grim and the
            grim package is registered — both fail on an image that installed
            nothing.
        distro:
            fedora:
                package:
                    - grim
        plan:
            - check: the grim screenshot binary is installed at /usr/bin/grim
              file:
                file: /usr/bin/grim
                exists: true
            - check: the grim package is registered with the package manager
              package:
                package: grim
                installed: true

wl-screenshot-grim-skill:
    skill:
        name: wl-screenshot-grim
        family: selkies
        owner: wl-screenshot-grim
        description: |-
            Wayland screenshot capture via `grim` using the wlr-screencopy protocol, for sway and standalone wlroots compositors.
            Use when capturing screenshots on wlroots desktops — NOT on selkies-desktop (use wl-screenshot-pixelflux there).
